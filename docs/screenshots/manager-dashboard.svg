<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <filter id="mShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="12" width="36" height="36" rx="10" fill="#1e40af"/>
  <text x="43" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="16">MB</text>
  <text x="75" y="30" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Megabyte System</text>
  <text x="75" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Engineering Manager &amp; Review Panel</text>

  <!-- Role Switcher -->
  <rect x="475" y="14" width="250" height="32" rx="8" fill="#f1f5f9"/>
  <rect x="477" y="16" width="120" height="28" rx="6" fill="#ffffff"/>
  <text x="537" y="34" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Manager Panel</text>
  <text x="660" y="34" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Personal Logs</text>

  <!-- Profile badge -->
  <rect x="1000" y="14" width="175" height="32" rx="16" fill="#fef3c7"/>
  <circle cx="1018" cy="30" r="10" fill="#d97706"/>
  <text x="1018" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">M</text>
  <text x="1035" y="34" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Lead Architect</text>

  <!-- Blocker Resolution Center (Prominent Red Alert Card) -->
  <g transform="translate(30, 80)">
    <rect width="1140" height="210" rx="16" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#mShadow)"/>
    <rect x="25" y="20" width="32" height="32" rx="8" fill="#fee2e2"/>
    <text x="41" y="42" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">!</text>
    <text x="70" y="38" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Blocker Resolution Center (Priority Dispatch)</text>
    <rect x="420" y="24" width="105" height="22" rx="11" fill="#ef4444"/>
    <text x="472" y="39" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">1 Urgent Ticket</text>

    <!-- Urgent Blocker Ticket Item -->
    <rect x="25" y="65" width="1090" height="120" rx="12" fill="#fff5f5" stroke="#fecaca"/>
    <text x="45" y="92" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Core API Schema Mismatch - Reported by Ali Rezaei (Backend Dept)</text>
    <rect x="1000" y="78" width="95" height="24" rx="6" fill="#dc2626"/>
    <text x="1047" y="94" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Critical Priority</text>

    <text x="45" y="115" fill="#475569" font-family="system-ui, sans-serif" font-size="12">Public profiles join query rejected due to missing SECURITY DEFINER context on helper function.</text>

    <!-- Manager Resolution Action Button -->
    <rect x="45" y="135" width="220" height="34" rx="8" fill="#1e40af"/>
    <text x="155" y="156" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Dispatch Solution &amp; Resolve</text>

    <text x="280" y="156" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Resolves blocker and approves work log simultaneously</text>
  </g>

  <!-- Team Activity Review Queue -->
  <g transform="translate(30, 310)">
    <rect width="1140" height="460" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#mShadow)"/>
    <text x="25" y="38" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Team Activity Review Queue</text>
    <text x="25" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Inspect completed deliverables, approve logs or request revisions with engineering feedback</text>

    <!-- Filters Row -->
    <rect x="700" y="25" width="130" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="715" y="47" fill="#334155" font-family="system-ui, sans-serif" font-size="11">All Employees</text>

    <rect x="840" y="25" width="130" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="855" y="47" fill="#334155" font-family="system-ui, sans-serif" font-size="11">All Projects</text>

    <rect x="980" y="25" width="135" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="995" y="47" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Pending Review</text>

    <!-- Review Item 1 -->
    <rect x="25" y="80" width="1090" height="105" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="45" y="110" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Seyed Nima Rounaghi</text>
    <text x="220" y="110" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Frontend Engineering</text>
    <rect x="360" y="96" width="160" height="22" rx="6" fill="#eff6ff"/>
    <text x="440" y="111" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Megabyte Cloud Platform</text>
    <rect x="980" y="96" width="115" height="22" rx="11" fill="#fef3c7"/>
    <text x="1037" y="111" text-anchor="middle" fill="#b45309" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Pending Review</text>

    <text x="45" y="140" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Implemented responsive RTL layouts, Vazirmatn typography, and persistent stopwatch state retention.</text>
    <text x="45" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Duration: 3 Hours 30 Mins | Reported Progress: 90% | Sub-tasks: 4 of 4 completed</text>

    <rect x="870" y="135" width="100" height="32" rx="8" fill="#059669"/>
    <text x="920" y="155" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Approve</text>

    <rect x="980" y="135" width="115" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1037" y="155" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Add Feedback</text>

    <!-- Review Item 2 -->
    <rect x="25" y="200" width="1090" height="105" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="45" y="230" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Sarah Tehrani</text>
    <text x="160" y="230" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">QA and Security</text>
    <rect x="280" y="216" width="170" height="22" rx="6" fill="#eff6ff"/>
    <text x="365" y="231" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Infra Penetration Audit</text>
    <rect x="980" y="216" width="115" height="22" rx="11" fill="#ecfdf5"/>
    <text x="1037" y="231" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Approved</text>

    <text x="45" y="260" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Executed RLS penetration tests against non-admin auth tokens; verified data isolation 100%.</text>
    <text x="45" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Duration: 4 Hours 15 Mins | Reported Progress: 100% | Verified by Lead Architect</text>

    <!-- Bottom Actions -->
    <rect x="25" y="325" width="220" height="36" rx="8" fill="#1e293b"/>
    <text x="135" y="348" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Assign New Task</text>

    <rect x="260" y="325" width="220" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="370" y="348" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Create Project Milestone</text>
  </g>
</svg>
